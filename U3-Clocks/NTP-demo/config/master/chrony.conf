# Serve this container's current UTC time even without an upstream NTP source.
driftfile /var/lib/chrony/chrony.drift
pidfile /run/chronyd.pid
logdir /var/log/chrony
log measurements statistics tracking

bindaddress 0.0.0.0
port 123
allow all
local stratum 10
manual

bindcmdaddress 127.0.0.1
cmdallow 127.0.0.1
