services:
  ntp-master:
    build: .
    container_name: ntp-master
    hostname: ntp-master
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./config/master/chrony.conf:/etc/chrony/chrony.conf:ro
    networks:
      - ntp-net
    cap_add:
      - SYS_TIME
      - SYS_NICE
      - NET_BIND_SERVICE
    security_opt:
      - seccomp:unconfined
    init: true

  ntp-client:
    build: .
    container_name: ntp-client
    hostname: ntp-client
    environment:
      TZ: Europe/Madrid
    volumes:
      - ./config/client/chrony.conf:/etc/chrony/chrony.conf:ro
    networks:
      - ntp-net
    cap_add:
      - SYS_TIME
      - SYS_NICE
      - NET_BIND_SERVICE
    security_opt:
      - seccomp:unconfined
    depends_on:
      - ntp-master
    init: true

networks:
  ntp-net:
    driver: bridge
